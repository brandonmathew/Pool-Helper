name: Release

# Stable releases: tag vX.Y.Z on main.
# A tag containing -beta. publishes a prerelease instead (manual beta tags).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "PH_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          PH_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          PH_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          PH_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          export PH_VERSION_NAME="${GITHUB_REF_NAME#v}"
          export PH_VERSION_CODE="$(git rev-list --count HEAD)"
          ./gradlew :core:test :app:assembleRelease --console=plain

      - name: Package release assets
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/release/app-release.apk "PoolHelper-$VERSION.apk"
          sha256sum "PoolHelper-$VERSION.apk" > "PoolHelper-$VERSION.apk.sha256"
          ls -la PoolHelper-*

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PRERELEASE_FLAG=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then PRERELEASE_FLAG="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" \
            "PoolHelper-$VERSION.apk" "PoolHelper-$VERSION.apk.sha256" \
            --title "Pool Helper $VERSION" \
            --generate-notes $PRERELEASE_FLAG
