name: Beta release

# Every push to beta publishes a prerelease named after the target stable:
# if the latest stable is 1.0.0, betas are 2.0.0-beta.1, 2.0.0-beta.2, ...
# The version is assigned here, never on feature branches.
on:
  push:
    branches: [beta]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  beta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compute beta version
        id: version
        run: |
          LATEST_STABLE=$(git tag --list 'v[0-9]*' --sort=-v:refname | grep -v -- '-' | head -n 1 || true)
          if [ -z "$LATEST_STABLE" ]; then
            TARGET="1.0.0"
          else
            MAJOR="${LATEST_STABLE#v}"
            MAJOR="${MAJOR%%.*}"
            TARGET="$((MAJOR + 1)).0.0"
          fi
          N=$(git tag --list "v${TARGET}-beta.*" | wc -l)
          N=$((N + 1))
          echo "version=${TARGET}-beta.${N}" >> "$GITHUB_OUTPUT"
          echo "tag=v${TARGET}-beta.${N}" >> "$GITHUB_OUTPUT"
          echo "Beta version: ${TARGET}-beta.${N} (target stable $TARGET)"

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "PH_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed beta APK
        env:
          PH_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          PH_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          PH_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PH_VERSION_NAME: ${{ steps.version.outputs.version }}
        run: |
          export PH_VERSION_CODE="$(git rev-list --count HEAD)"
          ./gradlew :core:test :app:assembleRelease --console=plain

      - name: Publish beta prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cp app/build/outputs/apk/release/app-release.apk "PoolHelper-$VERSION.apk"
          sha256sum "PoolHelper-$VERSION.apk" > "PoolHelper-$VERSION.apk.sha256"
          gh release create "${{ steps.version.outputs.tag }}" \
            "PoolHelper-$VERSION.apk" "PoolHelper-$VERSION.apk.sha256" \
            --title "Pool Helper $VERSION" \
            --generate-notes --prerelease \
            --target beta
